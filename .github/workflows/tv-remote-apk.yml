name: Build TV Remote APK

on:
  push:
    paths:
      - "google-tv-remote/**"
      - ".github/workflows/tv-remote-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: google-tv-remote
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk TvRemote.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TvRemote-apk
          path: google-tv-remote/TvRemote.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-remote-latest
          name: ريموت Google TV (آخر إصدار)
          prerelease: true
          body: "حمّل TvRemote.apk وثبّته على هاتف أندرويد. (بُني من ${{ github.sha }})"
          files: google-tv-remote/TvRemote.apk
